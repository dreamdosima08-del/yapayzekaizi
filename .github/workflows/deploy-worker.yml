# worker/ klasöründe bir değişiklik main'e gelince analiz motorunu
# Cloudflare'e otomatik yükler. Elle çalıştırmak için: Actions → "Analiz motorunu yayınla" → Run workflow
name: Analiz motorunu yayınla

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Anahtarlar tanımlı mı?
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN veya CLOUDFLARE_ACCOUNT_ID tanımlı değil — yayın atlandı."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Sözdizimi kontrolü
        if: steps.check.outputs.ready == 'true'
        run: node --check worker/worker.js

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Cloudflare'e yayınla
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Kopyala-yapıştırda gelen boşluk/satır sonu/etiket fazlalıklarını temizle.
          # Cloudflare hesap kimliği her zaman 32 karakterlik onaltılık (hex) dizidir.
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$RAW_ACCOUNT" | grep -oiE '[0-9a-f]{32}' | head -1 | tr 'A-F' 'a-f' || true)
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          # Teşhis (değerleri göstermeden, sadece biçim bilgisi)
          acc_len=$(printf '%s' "$RAW_ACCOUNT" | wc -c | tr -d ' ')
          acc_lines=$(printf '%s\n' "$RAW_ACCOUNT" | wc -l | tr -d ' ')
          acc_kind="bilinmiyor"
          printf '%s' "$RAW_ACCOUNT" | grep -q '@' && acc_kind="e-posta gibi görünüyor"
          printf '%s' "$RAW_ACCOUNT" | grep -qiE '^[0-9a-f]{32}$' && acc_kind="doğru biçim"
          printf '%s' "$RAW_ACCOUNT" | grep -qiE 'http|cloudflare' && acc_kind="adres (URL) gibi görünüyor"
          tok_len=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | wc -c | tr -d ' ')
          echo "::warning::Teşhis — ACCOUNT_ID: ${acc_len} karakter, ${acc_lines} satır, tür: ${acc_kind} | API_TOKEN: ${tok_len} karakter"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID içinde 32 karakterlik hesap kimliği bulunamadı"; exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log

      - name: Hata özeti
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          # Hata satırlarını uyarı (annotation) olarak yaz ki dışarıdan okunabilsin
          [ -f deploy.log ] || exit 0
          sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -v '^\s*$' | tail -15 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Canlı sürümü doğrula
        if: steps.check.outputs.ready == 'true'
        run: |
          expected=$(grep -o 'version:"[0-9.]*"' worker/worker.js | head -1 | cut -d'"' -f2)
          echo "Beklenen sürüm: $expected"
          for i in 1 2 3 4 5 6; do
            out=$(curl -s https://yapayzekaizi.dreamdosima08.workers.dev)
            echo "$out" | grep -q "\"version\":\"$expected\"" && { echo "Canlı: $out"; exit 0; }
            sleep 5
          done
          echo "::error::Canlı Worker beklenen sürümü ($expected) döndürmedi: $out"; exit 1
